[package]
name = "siftd"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

[dependencies]
fend-core = "1.5.9"
ignore = "0.4.34"
nucleo-matcher = "0.3.1"
notify = "8.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "tokio-multithread", "proxy", "service"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
