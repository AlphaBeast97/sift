name: CI image

on:
  workflow_call:
    outputs:
      digest:
        description: Digest of the published image
        value: ${{ jobs.image.outputs.digest }}
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/ci/gnome51/Dockerfile
      - .github/workflows/ci-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: tools/ci/gnome51
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sift-gnome51:gnome51
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Pinned GNOME Shell 51 test image
