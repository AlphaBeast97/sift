name: Shell smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: shell-smoke
  cancel-in-progress: false

jobs:
  image:
    if: github.actor == github.repository_owner
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  smoke:
    needs: image
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Headless shell smoke
        run: |
          timeout 15m docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            -e HOME=/tmp \
            -e XDG_RUNTIME_DIR=/tmp/sift-runtime \
            -v "$PWD:/src" -w /src \
            ghcr.io/alphabeast97/sift-gnome51@${{ needs.image.outputs.digest }} \
            sh -c 'mkdir -p /tmp/sift-runtime && chmod 700 /tmp/sift-runtime && make test-shell'
