name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
       github.event.label.name == 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/alphabeast97/sift-gnome51:gnome51
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install JS dependencies
        run: npm ci
      - name: Lint and unit tests
        run: make test-gjs test-schema lint
      - name: Pack sanity
        run: make check-pack

  rust:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
       github.event.label.name == 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/alphabeast97/sift-gnome51:gnome51
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --manifest-path daemon/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path daemon/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: dbus-run-session -- cargo test --manifest-path daemon/Cargo.toml
