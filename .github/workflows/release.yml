name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  release:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alphabeast97/sift-gnome51:gnome51
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release artifacts
        run: make release
      - name: Attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/siftd
            dist/sift@alphabeast97.github.io.shell-extension.zip
            dist/SHA256SUMS
