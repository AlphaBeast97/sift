name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  release:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/alphabeast97/sift-gnome51:gnome51
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install JS dependencies
        run: npm ci
      - name: Test
        run: make test check-pack
      - name: Build release artifacts
        run: make release
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Measure resource usage
        run: |
          export XDG_RUNTIME_DIR=/tmp/sift-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          make resources
      - name: Compare with the previous release
        run: python3 tools/perf/resource_diff.py dist/resource-report.json > dist/RESOURCE_REPORT.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RESOURCE_REPORT.md
          files: |
            dist/siftd
            dist/sift@alphabeast97.github.io.shell-extension.zip
            dist/SHA256SUMS
            dist/resource-report.json
            dist/RESOURCE_REPORT.md
          fail_on_unmatched_files: true
