name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  binary:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: Build portable daemon
        run: cargo build --release --manifest-path daemon/Cargo.toml
      - name: Upload daemon
        uses: actions/upload-artifact@v4
        with:
          name: siftd-linux-x86_64
          path: daemon/target/release/siftd
          if-no-files-found: error

  packages:
    if: github.actor == github.repository_owner
    needs: binary
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download daemon
        uses: actions/download-artifact@v4
        with:
          name: siftd-linux-x86_64
          path: dist
      - name: Install packaging tools
        run: |
          chmod +x dist/siftd
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
      - name: Build .deb, .rpm and Arch packages
        run: PATH="$(go env GOPATH)/bin:$PATH" packaging/build-packages.sh
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: sift-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    if: github.actor == github.repository_owner
    needs: [binary, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/alphabeast97/sift-gnome51:gnome51
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install JS dependencies
        run: npm ci
      - name: Test
        run: make test check-pack
      - name: Download portable daemon
        uses: actions/download-artifact@v4
        with:
          name: siftd-linux-x86_64
          path: dist
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: sift-packages
          path: dist
      - name: Build release artifacts
        run: |
          chmod +x dist/siftd
          make release-artifacts
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Compose release notes
        run: python3 tools/release/release_body.py "$GITHUB_REF_NAME" > dist/RELEASE_NOTES.md
      - name: Attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: Sift ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/get.sh
            dist/sift-linux-x86_64.tar.gz
            dist/SHA256SUMS
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          fail_on_unmatched_files: true
